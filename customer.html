<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Underwriter Console - Customer</title>
  <link rel="stylesheet" href="styles/base.css" />
  <style>
    .customer-shell {
      width: min(980px, 94vw);
      margin: 0 auto;
    }

    .customer-hero {
      margin-bottom: 16px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      background: #fff;
      padding: 14px 16px;
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
    }

    .customer-hero-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .customer-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .back-link {
      color: #2563eb;
      text-decoration: none;
      font-size: 14px;
    }

    .risk-pill-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .risk-pill {
      display: inline-flex;
      border: 1px solid #d1d5db;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      color: #374151;
      background: #f8fafc;
    }

    .section-card {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      background: #fff;
      padding: 14px 16px;
      margin-bottom: 14px;
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
    }

    .section-head {
      margin: 0 0 10px 0;
      font-size: 18px;
    }

    .section-divider {
      border: none;
      border-top: 1px solid #f1f5f9;
      margin: 10px 0 0 0;
    }

    .tag-chip,
    .step-chip,
    .evidence-tag-chip {
      display: inline-flex;
      align-items: center;
      padding: 5px 10px;
      border: 1px solid #d1d5db;
      border-radius: 999px;
      margin: 0 8px 8px 0;
      font-size: 13px;
      background: #fff;
      cursor: pointer;
      color: #1f2937;
    }

    .step-chip {
      border-radius: 10px;
      padding: 8px 12px;
      background: #f9fafb;
    }

    .tag-chip.is-active,
    .evidence-tag-chip.is-active {
      background: #eef2ff;
      border-color: #a5b4fc;
      color: #312e81;
    }

    .accordion-item {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      margin-bottom: 8px;
      overflow: hidden;
      background: #fff;
    }

    .accordion-toggle {
      width: 100%;
      text-align: left;
      padding: 10px 12px;
      border: none;
      background: #f8fafc;
      cursor: pointer;
      color: #1f2937;
    }

    .accordion-panel {
      display: none;
      padding: 10px 12px;
      border-top: 1px solid #eef2f7;
    }

    .accordion-caret {
      float: right;
      color: #6b7280;
    }

    .evidence-summary-item {
      margin-bottom: 6px;
      padding: 1px 0;
    }

    .evidence-summary-item.is-highlighted {
      background: #f8fafc;
      border-left: 3px solid #cbd5e1;
      padding-left: 8px;
      border-radius: 4px;
    }

    .why-panel {
      display: none;
      margin-bottom: 10px;
      padding: 10px 12px;
      border: 1px solid #dbe3ef;
      border-radius: 8px;
      background: #f8fafc;
    }

    .activity-list {
      margin: 0 0 0 18px;
      padding: 0;
    }

    .primary-btn {
      background: #111827;
      color: #fff;
      border-color: #111827;
    }

    .primary-btn:hover {
      background: #0b1220;
      border-color: #0b1220;
    }

    #ai-launcher {
      position: fixed;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 40;
      border: 1px solid #d1d5db;
      background: #111827;
      color: #fff;
      border-radius: 999px;
      padding: 10px 12px;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.2);
    }

    #ai-panel {
      position: fixed;
      right: 52px;
      top: 50%;
      transform: translateY(-50%);
      width: 360px;
      height: 430px;
      min-width: 280px;
      min-height: 220px;
      max-width: min(92vw, 760px);
      max-height: min(86vh, 900px);
      background: #fff;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.18);
      display: none;
      z-index: 41;
      overflow: hidden;
    }

    #ai-panel.ai-open {
      display: flex;
      flex-direction: column;
    }

    #ai-panel.ai-collapsed {
      height: auto;
      min-height: 0;
    }

    #ai-panel.ai-collapsed #ai-body {
      display: none;
    }

    #ai-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid #e5e7eb;
      background: #f8fafc;
    }

    #ai-title {
      margin: 0;
      font-size: 14px;
      color: #111827;
    }

    .ai-btn {
      border: 1px solid #d1d5db;
      background: #fff;
      color: #374151;
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 12px;
      cursor: pointer;
    }

    #ai-body {
      display: flex;
      flex-direction: column;
      min-height: 0;
      flex: 1;
    }

    #ai-messages {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 10px 12px;
      display: grid;
      gap: 8px;
      background: #fff;
    }

    .ai-msg {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 13px;
      color: #1f2937;
      max-width: 94%;
      line-height: 1.4;
    }

    .ai-msg-user {
      margin-left: auto;
      background: #eff6ff;
      border-color: #bfdbfe;
    }

    .ai-msg-assistant {
      margin-right: auto;
      background: #f9fafb;
      border-color: #e5e7eb;
    }

    #ai-input-row {
      display: flex;
      gap: 8px;
      border-top: 1px solid #e5e7eb;
      padding: 10px 12px;
      background: #fff;
    }

    #ai-input {
      flex: 1;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
    }

    #ai-send {
      border: 1px solid #111827;
      border-radius: 8px;
      background: #111827;
      color: #fff;
      padding: 8px 10px;
      font-size: 13px;
      cursor: pointer;
    }

    #ai-panel.ai-expanded {
      width: min(680px, 94vw);
      height: min(82vh, 900px);
      right: 12px;
    }

    #ai-tools {
      border-bottom: 1px solid #e5e7eb;
      padding: 8px 12px;
      background: #fff;
      display: grid;
      gap: 8px;
    }

    #ai-suggest-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .ai-suggest-chip {
      border: 1px solid #d1d5db;
      background: #fff;
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 12px;
      cursor: pointer;
      color: #374151;
    }

    #ai-cite-row {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #4b5563;
    }

    #ai-resize {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 16px;
      height: 16px;
      cursor: nwse-resize;
      background:
        linear-gradient(135deg, transparent 45%, #9ca3af 46%, #9ca3af 54%, transparent 55%),
        linear-gradient(135deg, transparent 60%, #9ca3af 61%, #9ca3af 69%, transparent 70%);
      border-bottom-right-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="customer-shell">
      <nav class="topnav">
        <div class="nav-left">
          <a class="logo" href="index.html">Under</a>
        </div>
        <a class="nav-center nav-intel" href="intelligence.html" aria-label="Open Intelligence Center" data-tooltip="Intelligence Center">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.6"/>
            <circle cx="12" cy="12" r="2.3" fill="currentColor"/>
            <path d="M12 3.5a8.5 8.5 0 0 1 8.5 8.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M20.5 12a8.5 8.5 0 0 1-8.5 8.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>
            <path d="M6.6 7.4l3.2 3.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          <span class="sr-only">Intelligence Center</span>
        </a>
        <div class="nav-right">
          <a class="nav-link" href="index.html">Verify</a>
          <a class="nav-link" href="queue.html">Console</a>
          <a class="nav-link" href="workflows.html">Workflows</a>
        </div>
      </nav>
      <header class="page-header">
        <div style="display: flex; align-items: center; justify-content: flex-end; gap: 12px;">
          <a id="signOutLink" href="#" style="color: #2563eb; text-decoration: none; font-size: 14px;">Sign out</a>
        </div>
        <h1 style="margin-top: 10px;">Customer Profile</h1>
        <p class="muted">Inspect evidence, explanations, and recommended next actions.</p>
        <hr class="divider" />
      </header>

      <div id="content"></div>
    </div>
  </div>

  <button id="ai-launcher" type="button" aria-controls="ai-panel" aria-expanded="false">AI Chat</button>
  <section id="ai-panel" aria-label="AI Assistant">
    <div id="ai-header">
      <h3 id="ai-title">AI Assistant</h3>
      <div style="display: inline-flex; gap: 6px;">
        <button id="ai-expand" type="button" class="ai-btn">Expand</button>
        <button id="ai-toggle" type="button" class="ai-btn">Collapse</button>
        <button id="ai-close" type="button" class="ai-btn">Close</button>
      </div>
    </div>
    <div id="ai-body">
      <div id="ai-tools">
        <div>
          <p class="muted" style="font-size: 12px; margin: 0 0 6px 0;">Suggested prompts</p>
          <div id="ai-suggest-row">
            <button type="button" class="ai-suggest-chip" data-ai-prompt="Summarize this customer">Summarize</button>
            <button type="button" class="ai-suggest-chip" data-ai-prompt="What information is missing?">Missing</button>
            <button type="button" class="ai-suggest-chip" data-ai-prompt="What are the next steps?">Next steps</button>
            <button type="button" class="ai-suggest-chip" data-ai-prompt="Explain the customer tags">Explain tags</button>
          </div>
        </div>
        <label id="ai-cite-row"><input id="ai-cite" type="checkbox" /> Cite sources</label>
      </div>
      <div id="ai-messages">
        <div class="ai-msg ai-msg-assistant">Hi, I can help summarize this customer and suggest next steps.</div>
      </div>
      <div id="ai-input-row">
        <textarea id="ai-input" placeholder="Ask about this customer..." rows="2" style="resize: none;"></textarea>
        <button id="ai-send" type="button">Send</button>
      </div>
    </div>
    <div id="ai-resize" aria-hidden="true"></div>
  </section>

  <script>
    (function () {
      var path = window.location.pathname || "";
      var current = path.split("/").pop() || "index.html";
      document.querySelectorAll(".nav-link, .nav-intel, .intel-nav-link").forEach(function (el) {
        var href = el.getAttribute("href") || "";
        var target = href.split("/").pop();
        if (target && target === current) {
          el.classList.add("is-active");
        }
      });
    })();
  </script>
  <script>
    const AUTH_DISABLED = true;
    const currentUser = AUTH_DISABLED
      ? { id: "guest", name: "Guest User", role: "underwriter" }
      : null;

    if (!AUTH_DISABLED && localStorage.getItem("plgAuth") !== "true") {
      window.location.replace("index.html");
    }

    const signOutLink = document.getElementById("signOutLink");
    const content = document.getElementById("content");
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    window.__currentCustomer = null;

    signOutLink.addEventListener("click", function (event) {
      event.preventDefault();
      localStorage.removeItem("plgAuth");
      localStorage.removeItem("plgUserEmail");
      if (!AUTH_DISABLED) {
        window.location.replace("index.html");
      }
    });

    function renderError(message) {
      content.innerHTML = `
        <div class="section-card">
          <h1 style="margin: 0 0 12px 0;">Customer Not Found</h1>
          <p style="margin: 0 0 12px 0; color: #4b5563;">${message}</p>
          <a class="back-link" href="queue.html">&larr; Back to Queue</a>
        </div>
      `;
    }

    function renderCustomer(customer) {
      window.__currentCustomer = customer;
      const evidenceOrder = ["KYC", "KYB", "Bank", "Credit", "Web"];
      const highlightsHtml = customer.highlights
        .map(function (item) { return `<li style="margin-bottom: 6px;">${item}</li>`; })
        .join("");

      const tagsHtml = customer.tags
        .map(function (tag) {
          return `<button type="button" class="tag-chip" data-global-tag="${tag}">${tag}</button>`;
        })
        .join("");

      const stepsHtml = customer.nextSteps
        .map(function (step) {
          return `<button type="button" class="step-chip" data-step-action="${step}">${step}</button>`;
        })
        .join("");

      const evidence = customer.evidence || {};
      const tagEvidenceMap = customer.tagEvidenceMap || {};
      const evidenceHtml = evidenceOrder
        .map(function (section) {
          const sectionData = evidence[section] || {};
          const summaryItems = Array.isArray(sectionData.summary) ? sectionData.summary : [];
          const summaryHtml = summaryItems.length
            ? summaryItems.map(function (item) {
              return `<li class="evidence-summary-item" data-evidence-summary>${item}</li>`;
            }).join("")
            : '<li style="color: #6b7280;">No summary available.</li>';
          const rawPath = sectionData.rawPath || "";
          const tagsForSection = Object.keys(tagEvidenceMap).filter(function (tag) {
            const entries = Array.isArray(tagEvidenceMap[tag]) ? tagEvidenceMap[tag] : [];
            return entries.some(function (entry) {
              return entry.section === section;
            });
          });
          const tagChipsHtml = tagsForSection.length
            ? tagsForSection.map(function (tag) {
              return `<button type="button" class="evidence-tag-chip" data-evidence-tag="${tag}" data-evidence-section="${section}">${tag}</button>`;
            }).join("")
            : '<span style="color: #6b7280; font-size: 13px;">No tags mapped.</span>';

          return `
            <div class="accordion-item">
              <button type="button" class="accordion-toggle" data-evidence-toggle="${section}">
                <strong>${section}</strong> <span class="accordion-caret" data-evidence-caret="${section}">▸</span>
              </button>
              <div class="accordion-panel" data-evidence-panel="${section}">
                <ul style="margin: 0 0 10px 18px; padding: 0;">${summaryHtml}</ul>
                <div style="margin: 0 0 8px 0;">
                  <p style="margin: 0 0 6px 0; font-size: 13px; color: #4b5563;">Tags triggered by this evidence</p>
                  <div data-tag-chip-wrap="${section}">${tagChipsHtml}</div>
                </div>
                <button type="button" data-view-raw data-evidence-section="${section}" data-raw-path="${rawPath}" style="padding: 6px 10px; border: 1px solid #d1d5db; background: #f9fafb; border-radius: 6px; cursor: pointer;">View raw JSON</button>
              </div>
            </div>
          `;
        })
        .join("");

      content.innerHTML = `
        <header class="customer-hero">
          <div class="customer-hero-top">
            <a class="back-link" href="queue.html">&larr; Back to Queue</a>
          </div>
          <div class="customer-title-row">
            <h1 style="margin: 0 0 4px 0;">${customer.name}</h1>
            <a 
              id="viewActivityLogBtn" 
              class="btn primary-btn" 
              href="log.html?id=${encodeURIComponent(customer.id || "REPLACE_WITH_ID")}&name=${encodeURIComponent(customer.name || "")}"
            >
              View Activity Log
            </a>
          </div>
          <div class="risk-pill-row">
            <span class="risk-pill">Risk Tier: ${customer.riskTier}</span>
            <span class="risk-pill">Risk Score: ${customer.riskScore}</span>
          </div>
        </header>

        <section class="section-card">
          <h2 class="section-head">Highlights</h2>
          <ul style="margin: 0 0 0 18px; padding: 0;">${highlightsHtml}</ul>
          <hr class="section-divider" />
        </section>

        <section class="section-card">
          <h2 class="section-head">Tags</h2>
          <div id="mainTags">${tagsHtml}</div>
          <a id="clearExplainTop" href="#" style="display: none; color: #2563eb; text-decoration: none; font-size: 13px;">Clear</a>
          <hr class="section-divider" />
        </section>

        <section class="section-card">
          <h2 class="section-head">Evidence</h2>
          <div id="explainWhyPanel" class="why-panel">
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
              <h3 id="explainWhyTitle" style="margin: 0; font-size: 15px;">Why this tag</h3>
              <a id="clearExplainMode" href="#" style="color: #2563eb; text-decoration: none; font-size: 13px;">Clear explain mode</a>
            </div>
            <div id="explainWhyContent" style="margin-top: 8px;"></div>
          </div>
          <div id="evidenceAccordion">${evidenceHtml}</div>
          <hr class="section-divider" />
        </section>

        <section class="section-card">
          <h2 class="section-head">Recommended Next Steps</h2>
          <div id="nextSteps">${stepsHtml}</div>
          <hr class="section-divider" />
        </section>

        <section class="section-card">
          <h2 class="section-head">Activity</h2>
          <button id="clearActivity" type="button" style="padding: 0; border: none; background: none; color: #2563eb; cursor: pointer; margin-bottom: 10px;">Clear Activity</button>
          <ul id="activityLog" class="activity-list"></ul>
        </section>

        <div id="rawJsonModalBackdrop" style="display: none; position: fixed; inset: 0; background: rgba(17, 24, 39, 0.45); z-index: 20;"></div>
        <div id="rawJsonModal" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(760px, 92vw); max-height: 80vh; overflow: auto; background: #fff; border: 1px solid #d1d5db; border-radius: 8px; z-index: 21;">
          <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #e5e7eb;">
            <h3 id="rawJsonModalTitle" style="margin: 0; font-size: 16px;">Raw JSON</h3>
            <button id="rawJsonModalClose" type="button" style="border: 1px solid #d1d5db; background: #fff; border-radius: 4px; width: 28px; height: 28px; cursor: pointer;">X</button>
          </div>
          <pre id="rawJsonModalContent" style="margin: 0; padding: 12px; font-size: 12px; white-space: pre-wrap; word-break: break-word;"></pre>
        </div>
      `;

      const storageKey = "activity:" + id;

      function readActivity() {
        try {
          const raw = localStorage.getItem(storageKey);
          return raw ? JSON.parse(raw) : [];
        } catch (e) {
          return [];
        }
      }

      function saveActivity(entries) {
        localStorage.setItem(storageKey, JSON.stringify(entries));
      }

      function renderActivity() {
        const activityLog = document.getElementById("activityLog");
        const entries = readActivity();

        if (!entries.length) {
          activityLog.innerHTML = '<li style="color: #6b7280;">No activity yet.</li>';
          return;
        }

        activityLog.innerHTML = entries
          .map(function (entry) {
            return `<li style="margin-bottom: 6px;"><strong>${entry.timestamp}</strong> - ${entry.action}</li>`;
          })
          .join("");
      }

      document.getElementById("nextSteps").addEventListener("click", function (event) {
        const button = event.target.closest("button[data-step-action]");
        if (!button) return;

        const entries = readActivity();
        entries.push({
          timestamp: new Date().toLocaleString(),
          action: button.textContent.trim()
        });
        saveActivity(entries);
        renderActivity();
      });

      document.getElementById("clearActivity").addEventListener("click", function () {
        localStorage.removeItem(storageKey);
        renderActivity();
      });

      const evidenceAccordion = document.getElementById("evidenceAccordion");
      const mainTags = document.getElementById("mainTags");
      const clearExplainTop = document.getElementById("clearExplainTop");
      const explainWhyPanel = document.getElementById("explainWhyPanel");
      const explainWhyTitle = document.getElementById("explainWhyTitle");
      const explainWhyContent = document.getElementById("explainWhyContent");
      const clearExplainMode = document.getElementById("clearExplainMode");
      const rawJsonModalBackdrop = document.getElementById("rawJsonModalBackdrop");
      const rawJsonModal = document.getElementById("rawJsonModal");
      const rawJsonModalTitle = document.getElementById("rawJsonModalTitle");
      const rawJsonModalContent = document.getElementById("rawJsonModalContent");
      const rawJsonModalClose = document.getElementById("rawJsonModalClose");
      let activeExplainTag = null;

      function openRawJsonModal() {
        rawJsonModalBackdrop.style.display = "block";
        rawJsonModal.style.display = "block";
      }

      function closeRawJsonModal() {
        rawJsonModalBackdrop.style.display = "none";
        rawJsonModal.style.display = "none";
      }

      function setPanelOpen(section, open) {
        const panel = evidenceAccordion.querySelector('[data-evidence-panel="' + section + '"]');
        const caret = evidenceAccordion.querySelector('[data-evidence-caret="' + section + '"]');
        if (!panel || !caret) return;
        panel.style.display = open ? "block" : "none";
        caret.textContent = open ? "▾" : "▸";
      }

      function closeAllPanels() {
        evidenceOrder.forEach(function (section) {
          setPanelOpen(section, false);
        });
      }

      function clearAllHighlightsAndState() {
        evidenceAccordion.querySelectorAll('li[data-evidence-summary]').forEach(function (item) {
          item.classList.remove("is-highlighted");
        });
        evidenceAccordion.querySelectorAll('button[data-evidence-tag]').forEach(function (chip) {
          chip.classList.remove("is-active");
        });
        mainTags.querySelectorAll('button[data-global-tag]').forEach(function (chip) {
          chip.classList.remove("is-active");
        });
        explainWhyPanel.style.display = "none";
        explainWhyContent.innerHTML = "";
        clearExplainTop.style.display = "none";
      }

      function getTagEntriesBySection(tag) {
        const entries = Array.isArray(tagEvidenceMap[tag]) ? tagEvidenceMap[tag] : [];
        const grouped = {};
        entries.forEach(function (entry) {
          if (!grouped[entry.section]) {
            grouped[entry.section] = [];
          }
          grouped[entry.section].push(entry);
        });
        return grouped;
      }

      function clearExplainModeState() {
        activeExplainTag = null;
        clearAllHighlightsAndState();
        closeAllPanels();
      }

      function applyExplainMode(tag) {
        clearAllHighlightsAndState();
        activeExplainTag = tag;
        const entriesBySection = getTagEntriesBySection(tag);
        const sections = Object.keys(entriesBySection);

        if (!sections.length) {
          clearExplainTop.style.display = "inline-block";
          return;
        }

        sections.forEach(function (section) {
          setPanelOpen(section, true);
          const panel = evidenceAccordion.querySelector('[data-evidence-panel="' + section + '"]');
          if (!panel) return;

          const matches = entriesBySection[section].map(function (entry) {
            return String(entry.match || "").toLowerCase();
          });

          panel.querySelectorAll('li[data-evidence-summary]').forEach(function (item) {
            const text = item.textContent.toLowerCase();
            if (matches.some(function (matchText) { return matchText && text.includes(matchText); })) {
              item.classList.add("is-highlighted");
            }
          });
        });

        mainTags.querySelectorAll('button[data-global-tag]').forEach(function (chip) {
          if (chip.getAttribute("data-global-tag") === tag) {
            chip.classList.add("is-active");
          }
        });
        evidenceAccordion.querySelectorAll('button[data-evidence-tag]').forEach(function (chip) {
          if (chip.getAttribute("data-evidence-tag") === tag) {
            chip.classList.add("is-active");
          }
        });

        const whySectionsHtml = sections.map(function (section) {
          const reasonItems = entriesBySection[section]
            .map(function (entry) {
              const base = '<li style="margin-bottom: 6px;">' + entry.reason + "</li>";
              if (entry.source && entry.source !== "summary") {
                return base + '<li style="margin-bottom: 6px; color: #4b5563;">See raw JSON signals (matched: ' + entry.match + ")</li>";
              }
              return base;
            })
            .join("");
          return (
            '<div style="margin-bottom: 8px;">' +
            '<p style="margin: 0 0 4px 0;"><strong>' + section + "</strong></p>" +
            '<ul style="margin: 0 0 0 18px; padding: 0;">' + reasonItems + "</ul>" +
            "</div>"
          );
        }).join("");

        explainWhyTitle.textContent = 'Why this tag: ' + tag;
        explainWhyContent.innerHTML = whySectionsHtml;
        explainWhyPanel.style.display = "block";
        clearExplainTop.style.display = "inline-block";
      }

      function toggleExplainMode(tag) {
        if (activeExplainTag === tag) {
          clearExplainModeState();
          return;
        }
        applyExplainMode(tag);
      }

      evidenceAccordion.addEventListener("click", function (event) {
        const toggleButton = event.target.closest("button[data-evidence-toggle]");
        if (toggleButton) {
          const section = toggleButton.getAttribute("data-evidence-toggle");
          const panel = evidenceAccordion.querySelector('[data-evidence-panel="' + section + '"]');
          const caret = evidenceAccordion.querySelector('[data-evidence-caret="' + section + '"]');
          const isOpen = panel.style.display === "block";
          panel.style.display = isOpen ? "none" : "block";
          caret.textContent = isOpen ? "▸" : "▾";
          return;
        }

        const tagChip = event.target.closest("button[data-evidence-tag]");
        if (tagChip) {
          const tag = tagChip.getAttribute("data-evidence-tag");
          toggleExplainMode(tag);
          return;
        }

        const rawButton = event.target.closest("button[data-view-raw]");
        if (!rawButton) return;

        const section = rawButton.getAttribute("data-evidence-section");
        const rawPath = rawButton.getAttribute("data-raw-path");
        rawJsonModalTitle.textContent = section + " – Raw JSON";
        rawJsonModalContent.textContent = "Loading...";
        openRawJsonModal();

        if (!rawPath) {
          rawJsonModalContent.textContent = "Could not load raw JSON";
          return;
        }

        fetch(rawPath)
          .then(function (response) {
            if (!response.ok) {
              throw new Error("Failed to load raw JSON");
            }
            return response.json();
          })
          .then(function (data) {
            rawJsonModalContent.textContent = JSON.stringify(data, null, 2);
          })
          .catch(function () {
            rawJsonModalContent.textContent = "Could not load raw JSON";
          });
      });

      rawJsonModalClose.addEventListener("click", closeRawJsonModal);
      rawJsonModalBackdrop.addEventListener("click", closeRawJsonModal);
      mainTags.addEventListener("click", function (event) {
        const tagChip = event.target.closest("button[data-global-tag]");
        if (!tagChip) return;
        toggleExplainMode(tagChip.getAttribute("data-global-tag"));
      });
      clearExplainTop.addEventListener("click", function (event) {
        event.preventDefault();
        clearExplainModeState();
      });
      clearExplainMode.addEventListener("click", function (event) {
        event.preventDefault();
        clearExplainModeState();
      });

      renderActivity();
    }

    if (!id) {
      renderError('Missing customer id. Open this page with a query like <strong>?id=acme</strong>.');
    } else {
      content.innerHTML = '<p style="margin: 0; color: #4b5563;">Loading...</p>';

      fetch("data/customers.json")
        .then(function (response) {
          if (!response.ok) {
            throw new Error("Fetch failed");
          }
          return response.json();
        })
        .then(function (customers) {
          if (!Array.isArray(customers)) {
            throw new Error("Invalid data");
          }

          const customer = customers.find(function (item) {
            return item.id === id;
          });

          if (!customer) {
            renderError('No customer found for id: <strong>' + id + "</strong>.");
            return;
          }

          renderCustomer(customer);
        })
        .catch(function () {
          renderError("Unable to load customer data right now.");
        });
    }
  </script>
  <script>
    (function () {
      var launcher = document.getElementById("ai-launcher");
      var panel = document.getElementById("ai-panel");
      var expandBtn = document.getElementById("ai-expand");
      var toggleBtn = document.getElementById("ai-toggle");
      var closeBtn = document.getElementById("ai-close");
      var messages = document.getElementById("ai-messages");
      var suggestRow = document.getElementById("ai-suggest-row");
      var citeCheckbox = document.getElementById("ai-cite");
      var input = document.getElementById("ai-input");
      var sendBtn = document.getElementById("ai-send");
      var resizeHandle = document.getElementById("ai-resize");
      if (!launcher || !panel || !expandBtn || !toggleBtn || !closeBtn || !messages || !suggestRow || !citeCheckbox || !input || !sendBtn || !resizeHandle) return;

      function isOpen() {
        return panel.classList.contains("ai-open");
      }

      function openPanel() {
        panel.classList.add("ai-open");
        panel.classList.remove("ai-collapsed");
        panel.classList.remove("ai-expanded");
        toggleBtn.textContent = "Collapse";
        expandBtn.textContent = "Expand";
        launcher.setAttribute("aria-expanded", "true");
      }

      function closePanel() {
        panel.classList.remove("ai-open");
        launcher.setAttribute("aria-expanded", "false");
      }

      function toggleCollapse() {
        var collapsed = panel.classList.toggle("ai-collapsed");
        toggleBtn.textContent = collapsed ? "Expand" : "Collapse";
      }

      function toggleExpand() {
        var expanded = panel.classList.toggle("ai-expanded");
        expandBtn.textContent = expanded ? "Shrink" : "Expand";
      }

      function appendMessage(role, text) {
        var node = document.createElement("div");
        node.className = "ai-msg " + (role === "user" ? "ai-msg-user" : "ai-msg-assistant");
        node.textContent = text;
        messages.appendChild(node);
        messages.scrollTop = messages.scrollHeight;
      }

      function getCustomer() {
        return window.__currentCustomer || null;
      }

      function buildSourceSuffix(customer, includeSources) {
        if (!includeSources || !customer) return "";
        return " Sources: customer.summary, customer.highlights, customer.nextSteps, customer.tags, customer.evidence.";
      }

      function getMockReply(userText, includeSources) {
        var t = userText.toLowerCase();
        var customer = getCustomer();
        if (!customer) {
          return "Mock: No customer record is currently loaded in context.";
        }

        if (t.indexOf("summary") >= 0 || t.indexOf("summarize") >= 0) {
          var summary = customer.summary || {};
          return "Mock summary: " + customer.name + " is " + customer.riskTier + " risk (score " + customer.riskScore + "). KYC: " + (summary.KYC || "n/a") + "; KYB: " + (summary.KYB || "n/a") + "; Bank: " + (summary.Bank || "n/a") + "; Credit: " + (summary.Credit || "n/a") + "." + buildSourceSuffix(customer, includeSources);
        }

        if (t.indexOf("missing") >= 0) {
          var missing = [];
          if (!Array.isArray(customer.highlights) || !customer.highlights.length) missing.push("highlights");
          if (!Array.isArray(customer.nextSteps) || !customer.nextSteps.length) missing.push("next steps");
          if (!customer.summary) missing.push("summary");
          if (!customer.evidence) missing.push("evidence");
          var msg = missing.length ? "Missing or thin fields: " + missing.join(", ") + "." : "No obvious missing core sections; consider validating freshness of evidence and ownership docs.";
          return "Mock: " + msg + buildSourceSuffix(customer, includeSources);
        }

        if (t.indexOf("next") >= 0 || t.indexOf("step") >= 0) {
          var steps = Array.isArray(customer.nextSteps) ? customer.nextSteps.slice(0, 3) : [];
          return "Mock next steps: " + (steps.length ? steps.join(" | ") : "Review underwriting checklist, request additional statements, and verify ownership docs.") + "." + buildSourceSuffix(customer, includeSources);
        }

        if (t.indexOf("tag") >= 0 || t.indexOf("explain") >= 0) {
          var tags = Array.isArray(customer.tags) ? customer.tags : [];
          var firstTag = tags[0];
          var mapping = customer.tagEvidenceMap && firstTag ? customer.tagEvidenceMap[firstTag] : null;
          var mappingHint = Array.isArray(mapping) && mapping[0] ? " For " + firstTag + ", mapped reason: " + mapping[0].reason + "." : "";
          return "Mock tag explanation: Active tags are " + (tags.length ? tags.join(", ") : "none") + "." + mappingHint + buildSourceSuffix(customer, includeSources);
        }

        if (t.indexOf("risk") >= 0) {
          return "Mock risk view: " + customer.name + " is currently " + customer.riskTier + " (" + customer.riskScore + "). Recommend enhanced review for elevated indicators." + buildSourceSuffix(customer, includeSources);
        }

        return "Mock: I can summarize this customer, identify missing information, recommend next steps, or explain tag-to-evidence mappings." + buildSourceSuffix(customer, includeSources);
      }

      function sendMessage() {
        var text = input.value.trim();
        if (!text) return;
        appendMessage("user", text);
        input.value = "";
        window.setTimeout(function () {
          appendMessage("assistant", getMockReply(text, !!citeCheckbox.checked));
        }, 250);
      }

      launcher.addEventListener("click", function () {
        if (isOpen()) {
          closePanel();
        } else {
          openPanel();
          input.focus();
        }
      });
      closeBtn.addEventListener("click", closePanel);
      expandBtn.addEventListener("click", toggleExpand);
      toggleBtn.addEventListener("click", toggleCollapse);
      sendBtn.addEventListener("click", sendMessage);
      input.addEventListener("keydown", function (event) {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          sendMessage();
        }
      });
      window.addEventListener("keydown", function (event) {
        if (event.key === "Escape" && isOpen()) {
          closePanel();
        }
      });

      suggestRow.addEventListener("click", function (event) {
        var chip = event.target.closest("button[data-ai-prompt]");
        if (!chip) return;
        var prompt = chip.getAttribute("data-ai-prompt") || "";
        if (!prompt) return;
        if (!isOpen()) openPanel();
        input.value = prompt;
        input.focus();
      });

      var resizing = false;
      var startX = 0;
      var startY = 0;
      var startW = 0;
      var startH = 0;

      resizeHandle.addEventListener("mousedown", function (event) {
        resizing = true;
        startX = event.clientX;
        startY = event.clientY;
        startW = panel.offsetWidth;
        startH = panel.offsetHeight;
        event.preventDefault();
      });

      window.addEventListener("mousemove", function (event) {
        if (!resizing) return;
        var nextW = startW + (event.clientX - startX);
        var nextH = startH + (event.clientY - startY);
        panel.style.width = Math.max(280, Math.min(window.innerWidth * 0.92, nextW)) + "px";
        panel.style.height = Math.max(220, Math.min(window.innerHeight * 0.86, nextH)) + "px";
      });

      window.addEventListener("mouseup", function () {
        resizing = false;
      });
    })();
  </script>
</body>
</html>
