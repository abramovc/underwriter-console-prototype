<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account</title>
  <link rel="stylesheet" href="styles/base.css" />
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8fafc;
      color: #111827;
    }

    .wrap {
      width: min(420px, 92vw);
      margin: 56px auto;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 16px;
      box-sizing: border-box;
    }

    h1 {
      margin: 0 0 14px 0;
      font-size: 22px;
    }

    label {
      display: block;
      font-size: 14px;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 14px;
    }

    button {
      border: 1px solid #d1d5db;
      background: #f9fafb;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 14px;
      cursor: pointer;
      width: 100%;
      margin-bottom: 10px;
    }

    a {
      color: #2563eb;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="container">
      <nav class="topnav">
        <div class="nav-left">
          <a class="logo" href="index.html">Under</a>
        </div>
        <a class="nav-center nav-intel" href="intelligence.html" aria-label="Open Intelligence Center" data-tooltip="Intelligence Center">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.6"/>
            <circle cx="12" cy="12" r="2.3" fill="currentColor"/>
            <path d="M12 3.5a8.5 8.5 0 0 1 8.5 8.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M20.5 12a8.5 8.5 0 0 1-8.5 8.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>
            <path d="M6.6 7.4l3.2 3.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          <span class="sr-only">Intelligence Center</span>
        </a>
        <div class="nav-right">
          <a class="nav-link" href="index.html">Verify</a>
          <a class="nav-link" href="queue.html">Console</a>
          <a class="nav-link" href="workflows.html">Workflows</a>
        </div>
      </nav>
      <main class="wrap">
        <header class="page-header">
          <h1>Create account</h1>
          <p class="muted">Set up an account to continue into the console experience.</p>
          <hr class="divider" />
        </header>

        <form id="signupForm">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required />

          <label for="password">Password</label>
          <input id="password" name="password" type="password" required />

          <button type="submit">Create account</button>
        </form>

        <a href="index.html">Back</a>
      </main>
    </div>
  </div>

  <script>
    (function () {
      var path = window.location.pathname || "";
      var current = path.split("/").pop() || "index.html";
      document.querySelectorAll(".nav-link, .nav-intel, .intel-nav-link").forEach(function (el) {
        var href = el.getAttribute("href") || "";
        var target = href.split("/").pop();
        if (target && target === current) {
          el.classList.add("is-active");
        }
      });
    })();
  </script>

  <script>
    const form = document.getElementById("signupForm");

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const email = form.email.value.trim();
      localStorage.setItem("plgAuth", "true");
      localStorage.setItem("plgUserEmail", email);

      window.location.href = "queue.html";
    });
  </script>
</body>
</html>
